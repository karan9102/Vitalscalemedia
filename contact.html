<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Help & Consultation - VitalScale Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans antialiased">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800/80 px-6 md:px-12 py-4 flex justify-between items-center">
        <div class="text-xl font-extrabold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
            VitalScale Media
        </div>
        <div class="hidden md:flex space-x-8 text-sm font-medium text-slate-300">
            <a href="index.html" class="transition hover:text-blue-400">Home</a>
            <a href="work.html" class="transition hover:text-blue-400">Our Work</a>
            <a href="contact.html" class="text-blue-400 font-semibold transition hover:text-blue-300">Get Help</a>
        </div>
        <div>
            <a href="contact.html" class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold px-5 py-2.5 rounded-xl text-sm">
                Get Started
            </a>
        </div>
    </nav>

    <!-- Contact Section -->
    <section class="py-20 px-6 max-w-3xl mx-auto">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-extrabold mb-4">Let's Grow Your Brand Together</h1>
            <p class="text-slate-400">Fill out the form below or connect with us directly for instant consultation.</p>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-8 md:p-10 rounded-3xl shadow-2xl">
            <form action="#" method="POST" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Your Full Name</label>
                    <input type="text" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500" placeholder="Karan Kumar">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Email Address</label>
                    <input type="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500" placeholder="you@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">How can we help you?</label>
                    <textarea rows="4" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500" placeholder="Tell us about your project (Meta Ads, Video Editing, Website, etc.)..."></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-4 rounded-xl shadow-lg shadow-blue-600/30 transition">
                    Send Message & Request Consultation
                </button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-slate-900/50 border-t border-slate-900 py-12 px-6 text-center text-slate-500 text-sm">
        <p>© 2026 VitalScale Media. All rights reserved.</p>
    </footer>

</body>
</html>
